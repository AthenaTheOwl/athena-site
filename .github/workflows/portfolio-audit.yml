name: Portfolio audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: pip install httpx pyyaml pytest

      - name: Materialize complete CDCP scope
        env:
          RANDOM_APPS_ROOT: ${{ github.workspace }}/../random-apps
        run: |
          python scripts/materialize_portfolio_scope.py \
            --manifest ops/portfolio-manifest.yml \
            --destination "$RANDOM_APPS_ROOT"

      - name: Verify control-plane tests
        run: python -m pytest -q

      - name: Validate cross-repo schema graph
        run: python scripts/validate_schema_graph.py

      - name: Run portfolio audit
        id: portfolio_audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RANDOM_APPS_ROOT: ${{ github.workspace }}/../random-apps
        run: |
          python scripts/portfolio_audit.py \
            --manifest ops/portfolio-manifest.yml \
            --output ops/portfolio-health.md \
            --auto-issue
        continue-on-error: true

      - name: Run portfolio dashboard
        id: portfolio_dashboard
        env:
          RANDOM_APPS_ROOT: ${{ github.workspace }}/../random-apps
        run: |
          python scripts/portfolio_dashboard.py \
            --manifest ops/portfolio-manifest.yml \
            --output ops/portfolio-status.md
        continue-on-error: true

      - name: Run evidence quorum sentinel
        id: evidence_quorum
        env:
          RANDOM_APPS_ROOT: ${{ github.workspace }}/../random-apps
        run: |
          python scripts/evidence_quorum_sentinel.py \
            --manifest ops/portfolio-manifest.yml \
            --output ops/evidence-quorum-report.md \
            --window-days 30 \
            --threshold 1
        continue-on-error: true

      - name: Run DEC dependency graph generator
        id: dec_graph
        if: always()
        env:
          RANDOM_APPS_ROOT: ${{ github.workspace }}/../random-apps
        run: |
          python scripts/dec_dependency_graph.py \
            --manifest ops/portfolio-manifest.yml \
            --output ops/dec-graphs
        continue-on-error: true

      - name: Run DEC coverage report
        id: dec_coverage
        if: always()
        env:
          RANDOM_APPS_ROOT: ${{ github.workspace }}/../random-apps
        run: |
          python scripts/dec_coverage_report.py \
            --manifest ops/portfolio-manifest.yml \
            --output ops/dec-coverage-report.md \
            --threshold 5
        continue-on-error: true

      - name: Sensitive disclosure gate
        id: sensitive_disclosure
        if: always()
        run: python scripts/validate_sensitive_disclosures.py
        continue-on-error: true

      - name: Commit complete reports if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/portfolio-health.md ops/portfolio-status.md ops/evidence-quorum-report.md ops/dec-graphs ops/dec-coverage-report.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "audit: weekly portfolio health + status + evidence quorum + DEC graphs + coverage"
            git push
          fi

      - name: Enforce report outcomes
        if: always()
        env:
          PORTFOLIO_AUDIT: ${{ steps.portfolio_audit.outcome }}
          PORTFOLIO_DASHBOARD: ${{ steps.portfolio_dashboard.outcome }}
          EVIDENCE_QUORUM: ${{ steps.evidence_quorum.outcome }}
          DEC_GRAPH: ${{ steps.dec_graph.outcome }}
          DEC_COVERAGE: ${{ steps.dec_coverage.outcome }}
          SENSITIVE_DISCLOSURE: ${{ steps.sensitive_disclosure.outcome }}
        run: |
          failed=0
          for result in \
            "$PORTFOLIO_AUDIT" \
            "$PORTFOLIO_DASHBOARD" \
            "$EVIDENCE_QUORUM" \
            "$DEC_GRAPH" \
            "$DEC_COVERAGE" \
            "$SENSITIVE_DISCLOSURE"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
